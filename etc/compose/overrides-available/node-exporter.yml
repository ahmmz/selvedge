# ==============================================================================
# Host Metrics (Prometheus node-exporter)
# Selvedge-Depends-On: monitoring
# Official Documentation: https://github.com/prometheus/node_exporter
# ==============================================================================
# Enable with:  make enable node-exporter
# Disable with: make disable node-exporter
# ==============================================================================
# Prometheus scrapes Traefik and CrowdSec, which report on themselves only. This
# override adds host CPU, memory, disk, filesystem, and network metrics, so a
# full disk or an out-of-memory condition is visible before it stops the stack.
#
# QUICKSTART INSTRUCTIONS:
# 1. Enable and restart:
#    make enable node-exporter && make restart
#
# Grafana then shows a "Node Exporter Full" dashboard. This override provisions
# it, so there is nothing to import.
# Source: https://grafana.com/grafana/dashboards/1860
#
# ------------------------------------------------------------------------------
# NOTES:
# - node-exporter reads the host filesystem to report on it. The mounts below are
#   read-only, and the container publishes no host port. Only Prometheus reaches
#   it, over the selvedge network.
# - pid: host lets the collectors count processes and read per-process limits.
# - Metrics describe the host, not the containers. Container-level statistics
#   need cAdvisor, which this override does not install.
# ==============================================================================

x-defaults: &defaults
  restart: ${RESTART_POLICY:-unless-stopped}
  security_opt:
    - no-new-privileges:true
  networks:
    - selvedge

x-common-env: &common
  TZ: ${TZ:-UTC}
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}

services:
  node-exporter:
    <<: *defaults
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    pid: host
    environment:
      <<: *common
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      # Ignore pseudo filesystems so the disk panels show real volumes only.
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2)($$|/)"

  prometheus:
    volumes:
      - ./etc/config/prometheus/scrape-available/node-exporter.yml:/etc/prometheus/scrape.d/node-exporter.yml:ro

  grafana:
    volumes:
      - ./etc/config/grafana/dashboards-available/node-exporter.json:/var/lib/grafana/dashboards/node-exporter.json:ro

