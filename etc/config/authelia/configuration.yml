# ==============================================================================
# Authelia v4 Configuration File
# Official Documentation: https://www.authelia.com/configuration/
# Theme-Park Custom Themes: https://theme-park.dev/
# ==============================================================================

server:
  host: 0.0.0.0
  port: 9091
  headers:
    csp_template: "default-src 'self'; style-src 'self' 'nonce-${NONCE}' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=' 'unsafe-inline' theme-park.dev raw.githubusercontent.com use.fontawesome.com; img-src 'self' theme-park.dev raw.githubusercontent.com data:; script-src 'self' 'unsafe-inline'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; font-src use.fontawesome.com;"

log:
  level: info

# Authelia Default Built-in Theme: auto | dark | light | grey
theme: dark

# ==============================================================================
# Theme-Park Custom Themes Integration (https://theme-park.dev/):
# Available Themes: nord, dracula, catppuccin, hotline, aquamarine, dark, etc.
# Direct CSS URL: https://theme-park.dev/css/base/authelia/<theme>.css
# ==============================================================================

default_redirection_url: https://auth.selvedge.local

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /var/lib/authelia/users_database.yml
    password:
      algorithm: argon2id
      argon2id:
        memory: 65536
        iterations: 3
        parallelism: 4

access_control:
  default_policy: deny
  rules:
    - domain: "*.selvedge.local"
      policy: two_factor

session:
  name: authelia_session
  same_site: lax
  expiration: 3600 # 1 hour
  inactivity: 300  # 5 minutes
  domain: selvedge.local

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 300

storage:
  local:
    path: /var/lib/authelia/db.sqlite

notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
