# ==============================================================================
# Promtail Configuration
# Ships Traefik and site-proxy access logs to Loki.
# ==============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Traefik access log (JSON when TRAEFIK_ACCESSLOG_FORMAT=json).
  - job_name: traefik
    static_configs:
      - targets: [localhost]
        labels:
          job: traefik
          __path__: /var/log/traefik/access.log
    pipeline_stages:
      - json:
          expressions:
            request_host: RequestHost
            router: RouterName
            service: ServiceName
            status: DownstreamStatus
      # Attribute each line to the target/router so a query can filter per site.
      - labels:
          request_host:
          router:

  # nginx site-proxy access log (present once the proxy add-on is enabled).
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log
